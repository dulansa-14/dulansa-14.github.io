<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Binadi Dulansa | Biotechnology Portfolio</title>

    <meta name="description"
        content="Binadi Dulansa's academic portfolio showcasing biotechnology education, skills, projects, and career goals.">

    <style>
        /* ---------- GENERAL STYLES ---------- */

        :root {
            --green: #456b50;
            --dark-green: #2e4936;
            --light-green: #e7eee5;
            --cream: #faf8f1;
            --white: #ffffff;
            --text: #333b34;
            --muted: #697269;
            --border: #dce4d9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--cream);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
        }


        /* ---------- NAVIGATION BAR ---------- */

        header {
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            min-height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 14px 0;
        }

        .logo {
            color: var(--dark-green);
            font-size: 21px;
            font-weight: bold;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 17px;
        }

        nav a {
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--green);
        }


        /* ---------- COMMON SECTION STYLES ---------- */

        section {
            padding: 75px 0;
        }

        .section-title {
            text-align: center;
            color: var(--dark-green);
            font-size: 32px;
            margin-bottom: 12px;
        }

        .section-description {
            text-align: center;
            color: var(--muted);
            max-width: 700px;
            margin: 0 auto 35px;
        }

        .card {
            background-color: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(40, 65, 45, 0.05);
        }


        /* ---------- HOME SECTION ---------- */

        #home {
            background: linear-gradient(
                135deg,
                var(--light-green),
                var(--cream)
            );

            padding: 85px 0;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }

        .hero-content {
            flex: 1;
        }

        .hero-content .welcome {
            color: var(--green);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .hero-content h1 {
            font-size: 43px;
            line-height: 1.25;
            color: var(--dark-green);
            margin-bottom: 18px;
        }

        .hero-content h2 {
            font-size: 22px;
            font-weight: normal;
            color: var(--green);
            margin-bottom: 18px;
        }

        .hero-content p {
            color: var(--muted);
            margin-bottom: 25px;
        }

        .profile-photo {
            display: block;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            border: 5px solid #d0ddcf;
            flex-shrink: 0;
            margin: auto;
        }

        .button {
            display: inline-block;
            background-color: var(--green);
            color: var(--white);
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid var(--green);
            transition: all 0.3s;
        }

        .button:hover {
            background-color: var(--dark-green);
            border-color: var(--dark-green);
            transform: translateY(-2px);
        }

        .button-outline {
            background-color: transparent;
            color: var(--green);
            margin-left: 10px;
        }

        .button-outline:hover {
            background-color: var(--green);
            color: var(--white);
        }


        /* ---------- ABOUT ME ---------- */

        #about {
            background-color: var(--white);
        }

        .about-card {
            max-width: 900px;
            margin: 0 auto;
        }

        .about-card p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .about-highlight {
            background-color: var(--light-green);
            border-left: 4px solid var(--green);
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
        }


        /* ---------- EDUCATION ---------- */

        .education-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            align-items: stretch;
        }

        .education-card {
            height: 100%;
            border-top: 4px solid var(--green);
        }

        .education-card h3 {
            color: var(--dark-green);
            font-size: 19px;
            margin-bottom: 8px;
        }

        .education-card .institution {
            color: var(--green);
            font-weight: bold;
            margin-bottom: 6px;
        }

        .education-card .year {
            color: var(--muted);
            font-size: 14px;
        }


        /* ---------- SKILLS AND COMPETENCIES ---------- */

        #skills {
            background-color: var(--white);
        }

        .skills-grid {
            display: grid;

            /* All skill boxes follow the same layout */
            grid-template-columns: repeat(3, minmax(0, 1fr));

            gap: 22px;
            align-items: stretch;
        }

        .skill-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;

            width: 100%;
            min-width: 0;
            min-height: 155px;
            height: 100%;

            padding: 24px;
            background-color: var(--cream);
            border: 1px solid var(--border);
            border-radius: 12px;

            transition: transform 0.3s, box-shadow 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(40, 65, 45, 0.09);
        }

        .skill-icon {
            font-size: 27px;
            margin-bottom: 10px;
        }

        .skill-card h3 {
            color: var(--dark-green);
            font-size: 17px;
            margin-bottom: 8px;
        }

        .skill-card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .language-card {
            background-color: var(--light-green);
        }


        /* ---------- PROJECTS ---------- */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
            align-items: stretch;
        }

        .project-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            border-top: 4px solid var(--green);
        }

        .project-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background-color: var(--light-green);
            color: var(--dark-green);
            border-radius: 50%;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .project-card h3 {
            color: var(--dark-green);
            font-size: 19px;
            margin-bottom: 10px;
        }

        .project-card p {
            color: var(--muted);
            font-size: 15px;
        }

        .project-tag {
            display: inline-block;
            background-color: var(--light-green);
            color: var(--dark-green);
            font-size: 12px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            margin-top: auto;
            margin-right: 5px;
            align-self: flex-start;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 18px;
        }


        /* ---------- CAREER GOALS ---------- */

        #career {
            background-color: var(--white);
        }

        .career-card {
            max-width: 900px;
            margin: 0 auto;
        }

        .career-card h3 {
            color: var(--dark-green);
            margin-bottom: 10px;
            margin-top: 22px;
        }

        .career-card h3:first-child {
            margin-top: 0;
        }

        .career-card p {
            color: var(--muted);
        }


        /* ---------- LEARNING REFLECTION ---------- */

        .reflection-card {
            max-width: 900px;
            margin: 0 auto;
        }

        .reflection-card p {
            margin-bottom: 16px;
            text-align: justify;
        }

        .reflection-card p:last-child {
            margin-bottom: 0;
        }


        /* ---------- CV SECTION ---------- */

        #cv {
            background: linear-gradient(
                135deg,
                var(--light-green),
                var(--cream)
            );
        }

        .cv-card {
            max-width: 750px;
            margin: 0 auto;
            text-align: center;
        }

        .cv-card h3 {
            color: var(--dark-green);
            font-size: 24px;
            margin-bottom: 12px;
        }

        .cv-card p {
            color: var(--muted);
            margin-bottom: 22px;
        }

        .cv-card .button {
            margin: 5px;
        }


        /* ---------- CONTACT ---------- */

        #contact {
            background-color: var(--white);
        }

        .contact-card {
            max-width: 750px;
            margin: 0 auto;
            text-align: center;
        }

        .contact-card h3 {
            color: var(--dark-green);
            margin-bottom: 12px;
        }

        .contact-card p {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .contact-email {
            display: inline-block;
            color: var(--green);
            font-weight: bold;
            overflow-wrap: anywhere;
            margin-bottom: 20px;
        }


        /* ---------- FOOTER ---------- */

        footer {
            background-color: var(--dark-green);
            color: var(--white);
            text-align: center;
            padding: 25px 15px;
        }

        footer p {
            font-size: 14px;
        }


        /* ---------- TABLET RESPONSIVE DESIGN ---------- */

        @media (max-width: 850px) {

            .navbar {
                justify-content: center;
            }

            nav {
                gap: 12px;
            }

            .hero {
                gap: 30px;
            }

            .hero-content h1 {
                font-size: 36px;
            }

            .skills-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .education-grid,
            .projects-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }


        /* ---------- MOBILE RESPONSIVE DESIGN ---------- */

        @media (max-width: 600px) {

            .container {
                width: 92%;
            }

            section {
                padding: 55px 0;
            }

            #home {
                padding: 55px 0;
            }

            .navbar {
                padding: 14px 0;
                gap: 12px;
            }

            .logo {
                font-size: 19px;
            }

            nav {
                gap: 10px 14px;
            }

            nav a {
                font-size: 12px;
            }

            .hero {
                flex-direction: column-reverse;
                text-align: center;
                gap: 25px;
            }

            .profile-photo {
                width: 175px;
                height: 175px;
            }

            .hero-content h1 {
                font-size: 32px;
            }

            .hero-content h2 {
                font-size: 19px;
            }

            .button {
                padding: 11px 16px;
                font-size: 13px;
            }

            .button-outline {
                margin-left: 4px;
            }

            .section-title {
                font-size: 27px;
            }

            .section-description {
                font-size: 14px;
            }

            .skills-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 15px;
            }

            .skill-card {
                min-height: 0;
                padding: 20px;
            }
